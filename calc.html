<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TI-84 emulator</title>
<style>
:root{--ink:#1b2430;--lcd:#b3c2a5;--lcdink:#0b1208;--kh:42px;color-scheme:light dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:#dde1e7;color:var(--ink);font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
.stage{display:flex;flex-wrap:wrap;gap:36px;justify-content:center;align-items:flex-start;padding:calc(20px + env(safe-area-inset-top)) 14px calc(36px + env(safe-area-inset-bottom))}
.calc{width:100%;max-width:390px;background:linear-gradient(180deg,#3b3f47,#272a30);border-radius:26px 26px 46px 46px;padding:16px 15px 24px;box-shadow:0 20px 44px rgba(18,26,40,.38),inset 0 1px 0 rgba(255,255,255,.09);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.brand{display:flex;justify-content:space-between;align-items:baseline;color:#b4bac5;font-size:12px;margin:0 4px 10px;letter-spacing:.02em}
.brand b{font-weight:700;color:#e6e9ee;font-size:14px}
.bezel{background:#13151a;border-radius:11px;padding:10px;box-shadow:inset 0 2px 7px rgba(0,0,0,.7)}
.lcd{background:var(--lcd);border-radius:3px;padding:3px 6px 5px;box-shadow:inset 0 0 16px rgba(40,60,30,.4)}
.lcd.off{background:#3a3f38;box-shadow:none}
.status{display:flex;justify-content:space-between;height:14px;font:700 9px/14px Menlo,"SF Mono",monospace;color:var(--lcdink)}
.status b{background:var(--lcdink);color:var(--lcd);padding:0 3px;margin-right:3px;border-radius:2px}
.status i{font-style:normal;margin-right:5px}
.screen canvas{display:block;margin:0 auto}
.screen{touch-action:none;overflow:hidden;color:var(--lcdink);font-family:"SF Mono",Menlo,Consolas,"Liberation Mono","Courier New",monospace;font-weight:700;white-space:pre;cursor:default;width:100%}
.screen.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.screen.scroll::-webkit-scrollbar{display:none}
.r{height:var(--rh);line-height:var(--rh);white-space:pre}
.r[data-edit]{border-top:1px solid var(--lcdink)}
.r span{display:inline-block;height:var(--rh);vertical-align:top}
.inv{background:var(--lcdink);color:var(--lcd)}
.cur{animation:blink 1.1s steps(1) infinite}
@keyframes blink{0%,49%{background:var(--lcdink);color:var(--lcd)}50%,100%{background:transparent;color:inherit}}
.neg{transform:scaleX(.7) translateY(-.14em)}
.lcd.off .screen{visibility:hidden}
.keys{display:grid;grid-template-columns:repeat(5,1fr);column-gap:9px;row-gap:3px;margin-top:16px}
.kc{display:flex;flex-direction:column;min-width:0}
.lg{height:13px;display:flex;justify-content:space-between;font-size:10px;line-height:13px;padding:0 2px;white-space:nowrap;font-weight:600}
.l2{color:#6fb9f3}.la{color:#82d86c}
.key{height:var(--kh);border:0;border-radius:9px;font:600 13px/1 "Avenir Next","Segoe UI",system-ui,sans-serif;cursor:pointer;color:#17191d;background:#ececea;box-shadow:0 2px 0 #8d9097,0 4px 6px rgba(0,0,0,.35);touch-action:manipulation;padding:0;width:100%;white-space:nowrap}
.key:active,.key.lit{transform:translateY(2px);box-shadow:0 0 0 #8d9097,0 1px 3px rgba(0,0,0,.4)}
.k-num{background:#f4f3f0;font-size:16px}
.k-op{background:#cdd1d8;font-size:15px}
.k-fn{background:#4a4e57;color:#eef0f3;box-shadow:0 2px 0 #1b1d22,0 4px 6px rgba(0,0,0,.4);font-size:11.5px}
.k-2nd{background:#4ba7ea;color:#fff;box-shadow:0 2px 0 #276da3,0 4px 6px rgba(0,0,0,.4)}
.k-alpha{background:#6dc25b;color:#0f2409;box-shadow:0 2px 0 #3f8a30,0 4px 6px rgba(0,0,0,.4);font-size:11.5px}
.key.lit{outline:2px solid #fff3}
.k-fn:focus-visible,.key:focus-visible,.dp:focus-visible{outline:2px solid #ffd54a;outline-offset:2px}
.dpad{position:relative;margin-top:13px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#555a64,#2f3238);box-shadow:0 2px 0 #15171b,0 4px 8px rgba(0,0,0,.45);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);align-self:stretch;aspect-ratio:auto;min-height:0}
.dp{background:transparent;border:0;color:#e8eaee;font-size:13px;cursor:pointer;touch-action:manipulation;padding:0}
.dp:active{color:#ffd54a}
.dp.up{grid-area:1/2}.dp.left{grid-area:2/1}.dp.right{grid-area:2/3}.dp.down{grid-area:3/2}
.ref{width:100%;max-width:430px;font-size:14.5px;line-height:1.5}
.ref h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
.ref p{margin:0 0 14px;color:#3b4656}
.ref h2{font-size:14px;margin:18px 0 6px;color:#1b2430}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 12.5px/1.2 Menlo,"SF Mono","Courier New",monospace;background:#f3f5f8;border:1px solid #b9c1ce;border-radius:7px;padding:6px 8px;cursor:pointer;color:#1b2430;text-align:left}
.chip:hover{background:#fff;border-color:#6b7a90}
.syn{width:100%;border-collapse:collapse;font:12.5px/1.45 Menlo,"SF Mono","Courier New",monospace}
.syn td{padding:3px 0;border-bottom:1px solid #c8ced8;vertical-align:top}
.syn td:first-child{color:#1b2430;font-weight:700;padding-right:10px;white-space:nowrap}
.note{font-size:13px;color:#4b586a;margin-top:16px}
kbd{font:600 12px Menlo,monospace;background:#f3f5f8;border:1px solid #b9c1ce;border-radius:4px;padding:0 4px}
@media (max-width:420px){:root{--kh:38px}.key{font-size:12px}.k-num{font-size:15px}.k-fn,.k-alpha{font-size:10.5px}.keys{column-gap:7px}.calc{padding:14px 11px 22px}}
@media (prefers-color-scheme:dark){body{background:#12151b;color:#dfe4ec}.ref h2{color:#e6eaf1}.ref p,.note{color:#9aa6b8}.chip{background:#1d222b;border-color:#3a4352;color:#e6eaf1}.chip:hover{background:#262d39}.syn td{border-color:#2c3440}.syn td:first-child{color:#e6eaf1}kbd{background:#1d222b;border-color:#3a4352}}
@media (prefers-reduced-motion:reduce){.cur{animation:none;background:var(--lcdink);color:var(--lcd)}}
</style>
</head>
<body>

</section>

</main>

  if (k.length === 1 || k === 'Enter' || k === 'Backspace' || k === 'Delete' || k === 'Escape' || k.indexOf('Arrow') === 0) consumed = typeFlush(/^[0-9(]$/.test(k) ? k : '');
  if (/^[0-9]$/.test(k)) { if (!consumed) insertTokens([k]); }
  else if (k === '(' && consumed) { /* function token already includes the paren */ }
  else if (map[k]) insertTokens([map[k]]);
  else if (k === '-') insertTokens([TI.isUnaryCtx(curBefore()) ? '(-)' : '-']);
  else if (k === 'Enter') doCmd('enter');
  else if (k === 'Backspace' || k === 'Delete') doCmd('del');
  else if (k === 'Escape') doCmd('clear');
  else if (k === 'ArrowUp') doCmd('up'); else if (k === 'ArrowDown') doCmd('down');
  else if (k === 'ArrowLeft') doCmd('left'); else if (k === 'ArrowRight') doCmd('right');
  else handled = false;
  if (handled) { render(); e.preventDefault(); }
}

/* ---------- persistence ---------- */
var SKEY = 'ti84-stats-emulator-v1';
function save() {
  try {
    localStorage.setItem(SKEY, JSON.stringify({ lists: ST.lists, vars: ST.vars, ans: ST.ans, S: S, hist: U.hist.slice(-30), eh: U.eh.slice(-30) }));
  } catch (e) { /* storage unavailable */ }
}
function load() {
  try {
    var j = JSON.parse(localStorage.getItem(SKEY) || 'null'); if (!j) return;
    TI.LISTNAMES.forEach(function (n) { if (Array.isArray(j.lists[n])) ST.lists[n] = j.lists[n].filter(function (x) { return typeof x === 'number'; }); });
    for (var k in j.vars) if (ST.vars.hasOwnProperty(k) && typeof j.vars[k] === 'number') ST.vars[k] = j.vars[k];
    if (typeof j.ans === 'number' || Array.isArray(j.ans)) ST.ans = j.ans;
    if (j.S) { S.fmt = j.S.fmt || 'Normal'; S.dec = j.S.dec === null || typeof j.S.dec === 'number' ? j.S.dec : null; S.angle = j.S.angle === 'Degree' ? 'Degree' : 'Radian'; }
    if (Array.isArray(j.hist)) U.hist = j.hist.filter(function (h) { return h && Array.isArray(h.tk) && typeof h.res === 'string'; });
    if (Array.isArray(j.eh)) U.eh = j.eh.filter(Array.isArray);
  } catch (e) { /* ignore corrupt state */ }
}

/* ---------- wiring ---------- */
function loadExample(str) {
  U.menu = null; U.err = null; U.mode = 'home'; U.second = false; U.alpha = false; U.off = false;
  U.entry = TI.tokenize(str); U.cur = U.entry.length; U.ehi = -1; render();
  var c = $('calc'); if (c && c.scrollIntoView) c.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function init() {
  load(); buildKeys(); fit();
  $('keys').addEventListener('click', function (e) { var b = e.target.closest ? e.target.closest('button[data-id]') : null; if (b) press(b.getAttribute('data-id')); });
  $('screen').addEventListener('click', function (e) {
    if (U.off) return;
    var cv = $('cv'), r = cv.getBoundingClientRect();
    var ry = Math.floor((e.clientY - r.top) / (r.height / ROWS)), cx = Math.floor((e.clientX - r.left) / (r.width / COLS));
    var row = view.rows[ry]; if (!row) return;
    var i = rowIndex(row); if (i === null) return;
    var cell = row.cells[cx], o = cell && cell.o !== undefined ? cell.o : null;
    if (U.mode === 'menu') { U.menu.sel = i; menuChoose(i); }
    else if (U.mode === 'form') {
      var f = curFields()[i]; if (f.type === 'title') return;
      U.form.cur = i; formLand();
      if (f.type === 'calc') formEnter(); else if (f.type === 'choice' && o !== null) setChoice(f, o);
    }
    else if (U.mode === 'error') errChoose(i);
    else if (U.mode === 'mode') { U.msel.r = i; if (o !== null) { U.msel.c = o; modeSelect(); } }
    render();
  });
  $('screen').addEventListener('wheel', function (e) {
    if (U.mode !== 'home') return; e.preventDefault();
    homeScroll += e.deltaY > 0 ? -1 : 1; render();
  }, { passive: false });
  var ty = null;
  $('screen').addEventListener('touchstart', function (e) { ty = e.touches[0].clientY; }, { passive: true });
  $('screen').addEventListener('touchmove', function (e) {
    if (U.mode !== 'home' || ty === null) return;
    var step = CELLH * PX / (window.devicePixelRatio || 1), d = Math.round((ty - e.touches[0].clientY) / step);
    if (d) { homeScroll -= d; ty = e.touches[0].clientY; render(); }
  }, { passive: true });
  setInterval(function () { blinkOn = !blinkOn; if (!U.off) draw(); }, 550);
  document.addEventListener('click', function (e) {
    var c = e.target.closest ? e.target.closest('[data-ex]') : null; if (c) loadExample(c.getAttribute('data-ex'));
  });
  document.addEventListener('keydown', onKey);
  function refit() { fit(); render(); }
  window.addEventListener('resize', refit); window.addEventListener('orientationchange', function () { setTimeout(refit, 150); });
  window.addEventListener('load', refit); setTimeout(refit, 60); setTimeout(refit, 400);
  if (window.ResizeObserver) new ResizeObserver(refit).observe($('screen'));
  render();
  window.__ti = { U: U, press: press, render: render, onKey: onKey, loadExample: loadExample, view: view };
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
